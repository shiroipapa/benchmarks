<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme — Pricing</title>
  <link rel="stylesheet" href="styles/hero.css">
</head>
<body>
  <section class="hero hero--dark">
    <h1 class="hero__title">Ship faster with Acme</h1>
    <p class="hero__subtitle">One workspace for your whole team.</p>
    <div class="hero__actions">
      <a class="ds-button ds-button--primary" href="/signup">
        <span class="ds-button__label">Start free</span>
      </a>
      <a class="ds-button ds-button--ghost" href="/docs">Read the docs</a>
    </div>
  </section>

  <section class="ds-grid ds-grid--3">
    <article class="pricing-card">
      <div class="pricing-card__price">$0</div>
      <ul class="pricing-card__features"></ul>
    </article>
    <article class="pricing-card pricing-card--featured">
      <span class="ds-badge ds-badge--new">Popular</span>
      <div class="pricing-card__price">$29</div>
      <ul class="pricing-card__features"></ul>
    </article>
    <article class="">
      <div class="pricing-card__price">$79</div>
    </article>
  </section>
</body>
</html>
